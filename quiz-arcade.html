/* Layout: one question per screen, big tappable answer cards, progress trail on top. Single light look on purpose (projected in class). */
:root{
  --bg:#4a4a9d; --paper:#f6f1e7; --ink:#273752; --accent:#e46b3c; --teal:#2f8f8f; --good:#2e9e5b; --bad:#c9443a; --muted:#8b8fae; --card:#ffffff;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.board{max-width:1100px;margin:0 auto;background:var(--paper);border-radius:32px;padding:clamp(16px,3vw,36px);display:flex;flex-direction:column;gap:clamp(14px,2.4vw,26px);min-height:calc(100% - 0px);box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--bg);letter-spacing:.04em}
.trail{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;background:#dcd6ea;border:3px solid transparent}
.dot.now{border-color:var(--accent);background:var(--paper)}
.dot.ok{background:var(--good)}
.dot.retry{background:#f0b53c}
.stars{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--ink)}
.q{display:flex;align-items:center;gap:14px;justify-content:center;text-align:center}
.q h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5.2vw,3.6rem);line-height:1.05;margin:0;text-wrap:balance}
.q h1 b{color:var(--accent)}
.speak{flex:none;width:64px;height:64px;border-radius:50%;border:none;background:var(--teal);color:#fff;font-size:1.9rem;cursor:pointer;display:grid;place-items:center}
.speak:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:5px solid var(--accent);outline-offset:3px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,20px)}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{position:relative;background:var(--card);border:5px solid #d9d2c4;border-radius:26px;padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;font-family:var(--body);font-weight:700;font-size:clamp(1.4rem,3.2vw,2.2rem);color:var(--ink);text-align:left;transition:transform .12s,border-color .12s;min-height:110px}
.opt:hover{transform:translateY(-3px);border-color:var(--bg)}
.opt .num{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.8rem}
.opt .ico{font-size:2.6rem;flex:none}
.opts.three .opt{flex-direction:column;justify-content:center;text-align:center;padding:14px}
.opt svg{width:100%;height:auto;max-width:260px;display:block}
.opt.wrong{border-color:var(--bad);opacity:.45;cursor:default;transform:none}
.opt.right{border-color:var(--good);background:#e6f6ec}
.opt.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.feedback{min-height:72px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;text-align:center}
.msg{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4vw,2.8rem)}
.msg.ok{color:var(--good)} .msg.no{color:var(--bad)}
.btn{font-family:var(--display);font-weight:800;font-size:1.7rem;border:none;border-radius:999px;padding:12px 34px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 6px 0 #b5502b}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b5502b}
.btn.alt{background:var(--teal);box-shadow:0 6px 0 #1f6a6a}
.end{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-block:20px}
.end h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,9vw,6rem);color:var(--accent);margin:0;line-height:1}
.end p{font-size:clamp(1.4rem,3vw,2rem);margin:0;font-weight:700}
.bigstars{font-size:clamp(2.5rem,7vw,4.5rem);letter-spacing:.1em}
.teacher{font-size:.95rem;color:var(--muted);text-align:center;margin:0}
@media (max-width:640px){.opts,.opts.three{grid-template-columns:1fr}.opt{min-height:80px}.opts.three .opt{flex-direction:row}.opts.three .opt svg{max-width:150px}}
@media (prefers-reduced-motion:reduce){.opt,.opt.shake{transition:none;animation:none}}
</style>

function circuit(closed, lit){
  const bulb = lit ? S.bulbOn : S.bulbOff;
  const wire = closed
    ? `<path d="M50 46 L20 46 L20 110 L100 110 L100 46 L70 46" fill="none" stroke="#c9443a" stroke-width="5" stroke-linejoin="round"/>`

  return `<svg viewBox="0 0 120 130" role="img" aria-label="${closed?'circuito cerrado':'circuito abierto'}">

}

const QUESTIONS = [
 {say:"¿Qué es programar?", title:"¿Qué es <b>programar</b>?", opts:[
   {t:"Armar un juguete",i:"🧸"},{t:"Dibujar un robot",i:"✏️"},{t:"Dar órdenes a un robot",i:"🤖",ok:1},{t:"Jugar en la compu",i:"🎮"}]},
 {say:"¿Qué es la sintaxis?", title:"¿Qué es la <b>sintaxis</b>?", opts:[

 {say:"¿Qué es un algoritmo?", title:"¿Qué es un <b>algoritmo</b>?", opts:[

 {say:"¿Hace cuántos años, más o menos, se crearon los juegos Arcade?", title:"¿Hace cuántos años se crearon los juegos <b>Arcade</b>?", opts:[
   {t:"Hace 5 años",i:"🐣"},{t:"Hace 46 años",i:"👴",ok:1},{t:"Hace 100 años",i:"🏰"},{t:"El año pasado",i:"📅"}]},

];

let idx=0, firstTry=0, tried=false, results=[];
const app=document.getElementById('app');

function speak(text){
  try{ const s=window.speechSynthesis; if(!s) return; s.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='es-AR'; u.rate=.9;
    const v=s.getVoices().find(v=>v.lang&&v.lang.startsWith('es')); if(v) u.voice=v; s.speak(u);}catch(e){}
}
function header(){
  const dots=QUESTIONS.map((_,i)=>`<span class="dot ${results[i]||''} ${i===idx?'now':''}"></span>`).join('');
  return `<div class="top"><span class="brand">FUTUCOM</span><div class="trail" aria-label="Pregunta ${idx+1} de ${QUESTIONS.length}">${dots}</div><span class="stars">⭐ ${firstTry}</span></div>`;
}
function render(){
  if(idx>=QUESTIONS.length) return renderEnd();
  const q=QUESTIONS[idx]; tried=false;
  const opts=q.opts.map((o,k)=>{
    const inner=o.svg? o.svg : o.html? o.html : `<span class="ico" aria-hidden="true">${o.i}</span><span>${o.t}</span>`;
    return `<button class="opt" id="opt${k}" data-k="${k}"><span class="num">${k+1}</span>${inner}</button>`;}).join('');
  app.innerHTML=`${header()}
   <div class="q"><h1>${q.title}</h1><button class="speak" id="speak" aria-label="Escuchar la pregunta">🔊</button></div>
   ${q.scene||''}
   <div class="opts ${q.three?'three':''}">${opts}</div>
   <div class="feedback" id="fb"></div>`;
  document.getElementById('speak').onclick=()=>{
    const extra=q.opts.map((o,k)=>`${k+1}: ${o.t||o.say}`).join('. ');
    speak(q.say+'. '+extra);
  };
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k,b));
}
function choose(k,btn){
  const q=QUESTIONS[idx], o=q.opts[k], fb=document.getElementById('fb');
  if(btn.classList.contains('wrong')||btn.classList.contains('right')) return;
  if(o.ok){
    btn.classList.add('right');
    if(!tried){firstTry++; results[idx]='ok';} else results[idx]='retry';
    app.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    fb.innerHTML=`<span class="msg ok">¡Muy bien! 🎉</span><button class="btn" id="next">${idx<QUESTIONS.length-1?'Siguiente ➜':'Ver estrellas ⭐'}</button>`;
    speak('¡Muy bien!');
    const n=document.getElementById('next'); n.focus(); n.onclick=()=>{idx++;render();};
    app.querySelector('.stars').textContent='⭐ '+firstTry;
  }else{
    tried=true; btn.classList.add('wrong','shake'); btn.disabled=true;
    fb.innerHTML=`<span class="msg no">¡Probá otra vez! 💪</span>`;
    speak('¡Probá otra vez!');
  }
}
function renderEnd(){
  const total=QUESTIONS.length;
  app.innerHTML=`<div class="end"><h1>¡MUY BIEN!</h1>
   <p>Son grandes exploradores del código.</p>
   <div class="bigstars" aria-label="${firstTry} estrellas">${'⭐'.repeat(firstTry)||'🌟'}</div>
   <p>Acertaron ${firstTry} de ${total} a la primera.</p>
   <button class="btn alt" id="again">Jugar otra vez 🔄</button></div>`;
  speak('¡Muy bien! Son grandes exploradores del código.');
  document.getElementById('again').onclick=()=>{idx=0;firstTry=0;results=[];render();};
}
function renderStart(){
  app.innerHTML=`<div class="end"><span class="brand" style="font-size:2rem">FUTUCOM</span>
   <h1 style="color:var(--bg)">Quiz de programación y Arcade</h1>
   <p>Mirá, pensá y tocá la respuesta. 👆</p>
   <p>Tocá 🔊 para escuchar la pregunta.</p>
   <button class="btn" id="go">¡Empezar! 🚀</button>
   <p class="teacher">${QUESTIONS.length} preguntas · si se equivocan pueden volver a intentar</p></div>`;
  document.getElementById('go').onclick=render;
}
try{speechSynthesis.getVoices();}catch(e){}
renderStart();
</script>
